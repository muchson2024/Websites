<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratory Equipment Inventory</title>
  <style>
    /* Add your existing CSS styles here */
    .item-card {
      cursor: pointer;
      /* Add your other styling */
    }
    .item-detail-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
    }
    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      width: 80%;
      max-width: 900px;
      border-radius: 8px;
    }
    .close-modal {
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    .in-stock {
      color: green;
    }
    /* Add other necessary styles */
  </style>
</head>
<body>
  <div class="container">
    <h1>Laboratory Equipment Inventory</h1>
    
    <div class="equipment-container" id="equipment-container">
      <!-- Equipment cards will be dynamically inserted here -->
    </div>
  </div>

  <!-- Modal container will be dynamically inserted here -->
  <div id="modal-container"></div>

  <script>
    // Fetch data from the database
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        const response = await fetch('database.json');
        const data = await response.json();
        renderEquipmentCards(data.equipment);
        setupModals(data.equipment);
      } catch (error) {
        console.error('Error loading equipment data:', error);
        document.getElementById('equipment-container').innerHTML = 
          '<div class="error-message">Error loading equipment data. Please try again later.</div>';
      }
    });

    // Render equipment cards
    function renderEquipmentCards(equipmentList) {
      const container = document.getElementById('equipment-container');
      
      equipmentList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.onclick = function() { showModal(item.id); };
        
        card.innerHTML = `
          <div class="item-image">
            <img src="${item.imageUrl || 'placeholder.jpg'}" alt="${item.name}">
          </div>
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <div class="item-meta">${item.specifications.material}, ${item.specifications.sizeOptions.join(', ')}</div>
            <span class="item-status ${item.inventory.status.toLowerCase().replace(/\s+/g, '-')}">${item.inventory.status}</span>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Setup modals for each equipment
    function setupModals(equipmentList) {
      const modalContainer = document.getElementById('modal-container');
      
      equipmentList.forEach(item => {
        const modal = document.createElement('div');
        modal.id = item.id;
        modal.className = 'item-detail-modal';
        
        // Join array values with commas for display
        const sizeOptions = item.specifications.sizeOptions.join(', ');
        const types = item.specifications.types.join(', ');
        const tempRange = `${item.specifications.temperatureRange.min}°C to ${item.specifications.temperatureRange.max}°C`;
        const location = `Cabinet ${item.specifications.location.cabinet}, Shelf ${item.specifications.location.shelf}`;
        
        modal.innerHTML = `
          <div class="modal-content">
            <span class="close-modal" onclick="closeModal('${item.id}')">&times;</span>
            
            <div class="modal-grid">
              <div class="modal-image">
                <img src="${item.imageUrl || '/api/placeholder/350/300'}" alt="${item.name}">
              </div>
              
              <div class="modal-details">
                <h2>${item.name}</h2>
                <p>Also known as: ${item.aliases.join(', ')}</p>
                
                <div class="detail-section">
                  <h3>Specifications</h3>
                  <table class="specs-table">
                    <tr>
                      <th>Size Options</th>
                      <td>${sizeOptions}</td>
                    </tr>
                    <tr>
                      <th>Material</th>
                      <td>${item.specifications.material}</td>
                    </tr>
                    <tr>
                      <th>Type</th>
                      <td>${types}</td>
                    </tr>
                    <tr>
                      <th>Temperature Range</th>
                      <td>${tempRange}</td>
                    </tr>
                    <tr>
                      <th>Location</th>
                      <td>${location}</td>
                    </tr>
                  </table>
                </div>
                
                <div class="detail-section">
                  <h3>Purpose/Common Uses</h3>
                  <ul>
                    ${item.purposes.map(purpose => `<li>${purpose}</li>`).join('')}
                  </ul>
                </div>
                
                <div class="detail-section">
                  <h3>Proper Handling and Storage</h3>
                  <ul>
                    ${item.handling.map(handling => `<li>${handling}</li>`).join('')}
                  </ul>
                </div>
                
                <div class="detail-section">
                  <h3>Maintenance Procedures</h3>
                  <ul>
                    ${item.maintenance.map(maintenance => `<li>${maintenance}</li>`).join('')}
                  </ul>
                </div>
                
                <div class="qr-code">
                  <img src="/api/placeholder/150/150" alt="QR Code">
                  <p>Scan for inventory management</p>
                </div>
                
                <div class="action-buttons">
                  <button class="btn" onclick="printEquipmentDetails('${item.id}')">Print Details</button>
                  <button class="btn" style="background-color: var(--success);" onclick="updateInventory('${item.id}')">Update Inventory</button>
                </div>
              </div>
            </div>
          </div>
        `;
        
        modalContainer.appendChild(modal);
      });
    }

    // Show modal function
    function showModal(id) {
      document.getElementById(id).style.display = 'block';
      document.body.style.overflow = 'hidden'; // Prevent scrolling when modal is open
    }

    // Close modal function
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      document.body.style.overflow = 'auto'; // Restore scrolling
    }

    // Print equipment details function
    function printEquipmentDetails(id) {
      // Implement printing functionality
      console.log('Printing details for:', id);
      window.print();
    }

    // Update inventory function
    function updateInventory(id) {
      // Implement inventory update functionality
      console.log('Updating inventory for:', id);
      alert('Inventory updated successfully!');
    }

    // Close modal when clicking outside the content
    window.onclick = function(event) {
      const modals = document.getElementsByClassName('item-detail-modal');
      for (let i = 0; i < modals.length; i++) {
        if (event.target === modals[i]) {
          modals[i].style.display = 'none';
          document.body.style.overflow = 'auto';
        }
      }
    };
  </script>
</body>
</html>
